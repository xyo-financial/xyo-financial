# ==============================================================================
# XYO Enrichment Platform - Oracle Rules & Pattern Matcher
# Tier-1 Enterprise & High-Assurance Compliance:
# - Pod Security Standards (PSS) Restricted
# - OpenShift Security Context Constraints (SCC) restricted-v2
# - Non-root execution (UID/GID 10001:10001)
# - Immutable read-only root filesystem (readOnlyRootFilesystem: true)
# - Zero Linux capabilities (drop: [ALL])
# - Strict CPU and Memory limits & reservations
# ==============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: xyo-oracle
  namespace: xyo
  labels:
    app: xyo-oracle
    app.kubernetes.io/name: xyo-oracle
    app.kubernetes.io/component: rules-engine
    app.kubernetes.io/part-of: xyo-appliance
    app.kubernetes.io/version: "v2.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xyo-oracle
  template:
    metadata:
      labels:
        app: xyo-oracle
        app.kubernetes.io/name: xyo-oracle
        app.kubernetes.io/component: rules-engine
        app.kubernetes.io/part-of: xyo-appliance
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: syniol-registry-secret
      containers:
        - name: oracle
          image: cr.syniol.com/xyo/oracle:v2.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          env:
            - name: LOG_LEVEL
              value: "info"
            - name: XYO_BIND_ADDR
              value: "0.0.0.0:9092"
          ports:
            - containerPort: 9092
              name: grpc
          volumeMounts:
            - mountPath: /tmp
              name: tmp
            - mountPath: /run
              name: run
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9092
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9092
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: xyo-oracle
  namespace: xyo
  labels:
    app: xyo-oracle
    app.kubernetes.io/name: xyo-oracle
    app.kubernetes.io/component: rules-engine
    app.kubernetes.io/part-of: xyo-appliance
spec:
  type: ClusterIP
  ports:
    - port: 9092
      targetPort: 9092
      name: grpc
  selector:
    app: xyo-oracle

