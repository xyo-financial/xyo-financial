# ==============================================================================
# XYO Enrichment Platform - PostgreSQL Cache & Persistence
# Tier-1 Enterprise & High-Assurance Compliance:
# - Pod Security Standards (PSS) Restricted
# - OpenShift Security Context Constraints (SCC) restricted-v2
# - Non-root execution (UID/GID 10001:10001)
# - Immutable read-only root filesystem (readOnlyRootFilesystem: true)
# - Zero Linux capabilities (drop: [ALL])
# - Strict CPU and Memory limits & reservations
# ==============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: xyo-postgres
  namespace: xyo
  labels:
    app: xyo-postgres
    app.kubernetes.io/name: xyo-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: xyo-appliance
    app.kubernetes.io/version: "15-alpine"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xyo-postgres
  template:
    metadata:
      labels:
        app: xyo-postgres
        app.kubernetes.io/name: xyo-postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: xyo-appliance
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          env:
            - name: POSTGRES_DB
              value: "xyo"
            - name: POSTGRES_USER
              value: "xyo_user"
            - name: POSTGRES_PASSWORD
              value: "xyo_secure_pass"
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          ports:
            - containerPort: 5432
              name: postgres
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: pgdata
            - mountPath: /tmp
              name: tmp
            - mountPath: /var/run/postgresql
              name: run
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1500m
              memory: 1Gi
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - xyo_user
                - -d
                - xyo
                - -h
                - 127.0.0.1
                - -p
                - "5432"
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - xyo_user
                - -d
                - xyo
                - -h
                - 127.0.0.1
                - -p
                - "5432"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: xyo-postgres-pvc
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: xyo-postgres
  namespace: xyo
  labels:
    app: xyo-postgres
    app.kubernetes.io/name: xyo-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: xyo-appliance
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: xyo-postgres

