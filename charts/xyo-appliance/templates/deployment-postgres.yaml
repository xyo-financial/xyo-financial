{{- if and .Values.postgresql.enabled (not .Values.postgresql.external.enabled) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "xyo-appliance.fullname" . }}-postgres
  labels:
    {{- include "xyo-appliance.componentLabels" (dict "root" . "component" "postgres") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "xyo-appliance.componentSelectorLabels" (dict "root" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "xyo-appliance.componentLabels" (dict "root" . "component" "postgres") | nindent 8 }}
    spec:
      {{- include "xyo-appliance.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "xyo-appliance.serviceAccountName" . }}
      containers:
        - name: postgres
          image: "{{ include "xyo-appliance.imageRegistry" (dict "image" .Values.postgresql.image "root" .) }}{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.auth.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "xyo-appliance.dbSecretName" . }}
                  key: {{ .Values.postgresql.auth.secretKeys.password | default "postgres-password" }}
          ports:
            - name: postgres
              containerPort: {{ .Values.postgresql.service.targetPort | default 5432 }}
              protocol: TCP
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.postgresql.auth.username }}
                - -d
                - {{ .Values.postgresql.auth.database }}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.postgresql.auth.username }}
                - -d
                - {{ .Values.postgresql.auth.database }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
      volumes:
        - name: pgdata
          emptyDir: {}
{{- end }}
