{{- end }}
{{- if .Values.anvil.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "xyo-appliance.fullname" . }}-anvil
  labels:
    {{- include "xyo-appliance.componentLabels" (dict "root" . "component" "anvil") | nindent 4 }}
  {{- with .Values.anvil.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.anvil.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.anvil.service.port }}
