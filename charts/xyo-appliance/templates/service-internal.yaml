{{- if .Values.enrichment.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "xyo-appliance.fullname" . }}-enrichment
  labels:
    {{- include "xyo-appliance.componentLabels" (dict "root" . "component" "enrichment") | nindent 4 }}
  {{- with .Values.enrichment.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.enrichment.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.enrichment.service.port }}
      targetPort: {{ .Values.enrichment.service.targetPort | default 9091 }}
      protocol: TCP
      name: grpc
  selector:
    {{- include "xyo-appliance.componentSelectorLabels" (dict "root" . "component" "enrichment") | nindent 4 }}
---
{{- end }}
