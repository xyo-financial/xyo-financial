{{- if .Values.yoda.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "xyo-appliance.fullname" . }}-yoda
  labels:
    {{- include "xyo-appliance.componentLabels" (dict "root" . "component" "yoda") | nindent 4 }}
spec:
  replicas: {{ .Values.yoda.replicaCount }}
  selector:
    matchLabels:
      {{- include "xyo-appliance.componentSelectorLabels" (dict "root" . "component" "yoda") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "xyo-appliance.componentLabels" (dict "root" . "component" "yoda") | nindent 8 }}
    spec:
      {{- include "xyo-appliance.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "xyo-appliance.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: yoda
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ include "xyo-appliance.imageRegistry" (dict "image" .Values.yoda.image "root" .) }}{{ .Values.yoda.image.repository }}:{{ .Values.yoda.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.yoda.image.pullPolicy }}
          ports:
            - name: grpc
              containerPort: {{ .Values.yoda.service.targetPort | default 9093 }}
              protocol: TCP
          env:
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "xyo-appliance.fullname" . }}-config
                  key: LOG_LEVEL_YODA
          {{- if .Values.yoda.probes.liveness.enabled }}
          livenessProbe:
            tcpSocket:
              port: {{ .Values.yoda.probes.liveness.tcpSocket.port }}
            initialDelaySeconds: {{ .Values.yoda.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.yoda.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.yoda.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.yoda.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.yoda.probes.readiness.enabled }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.yoda.probes.readiness.tcpSocket.port }}
            initialDelaySeconds: {{ .Values.yoda.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.yoda.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.yoda.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.yoda.probes.readiness.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.yoda.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.yoda.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.yoda.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.yoda.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
