{{- if .Values.oracle.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "xyo-appliance.fullname" . }}-oracle
  labels:
    {{- include "xyo-appliance.componentLabels" (dict "root" . "component" "oracle") | nindent 4 }}
spec:
  replicas: {{ .Values.oracle.replicaCount }}
  selector:
    matchLabels:
      {{- include "xyo-appliance.componentSelectorLabels" (dict "root" . "component" "oracle") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "xyo-appliance.componentLabels" (dict "root" . "component" "oracle") | nindent 8 }}
    spec:
      {{- include "xyo-appliance.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "xyo-appliance.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: oracle
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ include "xyo-appliance.imageRegistry" (dict "image" .Values.oracle.image "root" .) }}{{ .Values.oracle.image.repository }}:{{ .Values.oracle.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.oracle.image.pullPolicy }}
          ports:
            - name: grpc
              containerPort: {{ .Values.oracle.service.targetPort | default 9092 }}
              protocol: TCP
          env:
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "xyo-appliance.fullname" . }}-config
                  key: LOG_LEVEL_ORACLE
          {{- if .Values.oracle.probes.liveness.enabled }}
          livenessProbe:
            tcpSocket:
              port: {{ .Values.oracle.probes.liveness.tcpSocket.port }}
            initialDelaySeconds: {{ .Values.oracle.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.oracle.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.oracle.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.oracle.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.oracle.probes.readiness.enabled }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.oracle.probes.readiness.tcpSocket.port }}
            initialDelaySeconds: {{ .Values.oracle.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.oracle.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.oracle.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.oracle.probes.readiness.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.oracle.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.oracle.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.oracle.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.oracle.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
