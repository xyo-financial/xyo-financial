## -----------------------------------------------------------------------------------
## Persistence (Shared Logo Storage for Gateway and Enrichment)
## -----------------------------------------------------------------------------------
persistence:
  logos:
    enabled: true
    mountPath: /var/lib/xyo/logos
    accessModes:
      - ReadWriteMany
    size: 10Gi
    # StorageClass name. Recommended: high-IOPS SSD class supporting RWX (e.g., efs-sc, managed-nfs-storage, ocs-storagecluster-cephfs)
    storageClass: ""
    # If using an existing PVC, set existingClaim name
    existingClaim: ""
    annotations: {}

## -----------------------------------------------------------------------------------
## PostgreSQL Database Configuration (Embedded appliance DB or External enterprise DB)
## -----------------------------------------------------------------------------------
postgresql:
  # Deploy internal PostgreSQL instance (suitable for standalone/poc/air-gap deployments)
  enabled: true
  
  image:
    registry: "docker.io"
    repository: "postgres"
    tag: "15-alpine"
    pullPolicy: IfNotPresent

  auth:
    database: "xyo"
    username: "xyo_user"
    # Required, and deliberately empty: the chart ships no credentials. Supply it at
    # install time, or set existingSecret to reference a Secret you manage. A rendered
    # chart with no credentials supplied fails with a message naming the missing value.
    password: ""
    existingSecret: ""
    secretKeys:
      password: "postgres-password"

  service:
    type: ClusterIP
    port: 5432
    targetPort: 5432

  persistence:
    enabled: false
    storageClass: ""
    size: 20Gi

  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

  # External Enterprise Database (AWS RDS Aurora, GCP Cloud SQL, Azure Database for PG, etc.)
  # When external.enabled is true, internal postgresql deployment is skipped and this DSN is used.
  external:
    enabled: false
    dsn: "" # e.g. "postgres://xyo_user:my_secret_pass@pg.corp.internal:5432/xyo?sslmode=require"
    existingSecret: ""
    secretKey: "dsn"

## -----------------------------------------------------------------------------------
## Ingress Configuration
## -----------------------------------------------------------------------------------
ingress:
  enabled: false
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
  hosts:
    - host: "xyo-appliance.internal.bank.com"
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: "xyo-appliance-tls"
      hosts:
        - "xyo-appliance.internal.bank.com"

## -----------------------------------------------------------------------------------
## Horizontal Pod Autoscaler (HPA)
## -----------------------------------------------------------------------------------
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80
  gateway:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
  enrichment:
    enabled: true
    minReplicas: 2
    maxReplicas: 10

## -----------------------------------------------------------------------------------
## Prometheus Metrics & Monitoring (ServiceMonitor CRD)
## -----------------------------------------------------------------------------------
metrics:
  enabled: false
  serviceMonitor:
    enabled: false
    namespace: ""
    interval: "30s"
    scrapeTimeout: "10s"
    telemetryPath: "/metrics"
    labels:
      release: "prometheus-stack"
    metricRelabelings: []
    relabelings: []

## -----------------------------------------------------------------------------------
## Additional Pod disruption budgets, ServiceAccount, and OpenShift settings
## -----------------------------------------------------------------------------------
serviceAccount:
  create: true
  name: ""
  annotations: {}

podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1

openshift:
  securityContextConstraints:
    enabled: false
    name: "nonroot"
