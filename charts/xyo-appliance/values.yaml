# Default values for xyo-appliance.
# Enterprise Air-Gapped AI Payment Transaction Enrichment Appliance for Kubernetes & OpenShift

## Global configuration settings applicable across all components
global:
  # Base container registry (e.g. cr.syniol.com or your internal private air-gapped registry mirror)
  imageRegistry: "cr.syniol.com"
  
  # Image pull secrets for accessing private registries
  imagePullSecrets:
    - name: "syniol-registry-secret"
  
  # XYO Enterprise Appliance Activation License Key.
  # Required, and deliberately empty: the chart ships no credentials. Supply it at
  # install time, or set existingLicenseSecret to reference a Secret you manage.
  # If set here, a Secret is created for you unless existingLicenseSecret is specified.
  licenseKey: ""
  
  # Reference an existing Secret containing the license key instead of managing it through Helm values
  existingLicenseSecret: ""
  licenseSecretKey: "license-key"

## Pod Security Context applied across all pods
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

## Container Security Context applied to all application containers
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  capabilities:
    drop:
      - ALL

## -----------------------------------------------------------------------------------
## Gateway Service (Public / Client-Facing API Endpoint)
## -----------------------------------------------------------------------------------
gateway:
  enabled: true
  replicaCount: 2
  
  image:
    registry: ""
    repository: "xyo/gateway"
    tag: "v2.0.0"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
    annotations: {}

  env:
    LOG_LEVEL: "info"
    PORT: "8080"

  probes:
    liveness:
      enabled: true
      path: /healthz
      port: 8080
      initialDelaySeconds: 15
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      enabled: true
      path: /readyz
      port: 8080
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    startup:
      enabled: true
      path: /healthz
      port: 8080
      initialDelaySeconds: 5
      periodSeconds: 5
      failureThreshold: 30

  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

  nodeSelector: {}
  tolerations: []
  affinity: {}

## -----------------------------------------------------------------------------------
## Enrichment Service (Core Orchestrator & Rule Coordinator)
## -----------------------------------------------------------------------------------
enrichment:
  enabled: true
  replicaCount: 2

  image:
    registry: ""
    repository: "xyo/enrichment"
    tag: "v2.0.0"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 9091
    targetPort: 9091
    annotations: {}

  env:
    LOG_LEVEL: "info"

  probes:
    liveness:
      enabled: true
      tcpSocket:
        port: 9091
      initialDelaySeconds: 15
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      enabled: true
      tcpSocket:
        port: 9091
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    startup:
      enabled: true
      tcpSocket:
        port: 9091
      initialDelaySeconds: 5
      periodSeconds: 5
      failureThreshold: 30

  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi

  nodeSelector: {}
  tolerations: []
  affinity: {}

## -----------------------------------------------------------------------------------
